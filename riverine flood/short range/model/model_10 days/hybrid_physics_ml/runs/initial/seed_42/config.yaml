data:
  daily_file: ../data/marala_daily.csv
  date_column: date
  basin_column: basin_id
  default_basin_id: marala
  target_column: q_cumecs
  dynamic_columns:
  - rain_chirps_mm
  - temperature_c
  - swe_mm
  - snow_depth_m
  - snowmelt_mm
  - dewpoint_c
  - ssrd_wm2
  - pet_mm
  static_file: null
  static_columns: []
  use_static: false
  past_discharge: false
  hindcast_length: 365
  forecast_horizon: 10
  calendar_features: true
  forecast_mode: reanalysis_with_noise
  forecast_file: null
  forecast_date_column: date
  forecast_lead_column: lead_day
  forecast_available_at_column: null
  issue_hour_utc: 24
  forecast_columns:
  - precipitation_mm
  - temperature_c
  reanalysis_columns:
  - rain_era5_mm
  - temperature_c
  noise:
    std_at_lead_1: 0.05
    std_growth_per_lead: 0.025
    evaluation_seed: 12345
splits:
  train:
  - 2016
  - 2020
  validation:
  - 2021
  - 2021
  test:
  - 2022
  - 2024
normalization:
  inputs: standard
  static: standard
  flow_scale_cumecs: 1.0
  standardize_log_flow: true
model:
  hidden_size: 64
  num_layers: 1
  dropout: 0.15
  lead_embedding_size: 8
  static_embedding_size: 8
  quantiles:
  - 0.05
  - 0.25
  - 0.5
  - 0.75
  - 0.95
training:
  flush_denormal: true
  output_dir: runs/initial
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 6
  min_delta: 0.0001
  gradient_clip: 1.0
  ensemble_size: 1
  seeds:
  - 42
  - 43
  - 44
  device: cpu
  cpu_threads: 2
finetuning:
  output_dir: runs/finetuned
  epochs: 10
  learning_rate: 0.0001
  freeze_hindcast: false
  recompute_normalization: false
evaluation:
  output_dir: reports/initial
  peak_percentile: 0.95
  flood_threshold_cumecs: null
  control_config: ../config.yaml
  control_checkpoint: ../lstm/runs/initial/seed_42/best.pt
  mass_balance_tolerance_mm: 0.002
model_family: hybrid_physics_ml
physics:
  gradient_history_days: 365
  history_columns:
    precipitation: rain_chirps_mm
    temperature: temperature_c
    swe: swe_mm
  forecast_columns:
    precipitation: precipitation_mm
    temperature: temperature_c
  initial_soil_mm: 100.0
  initial_groundwater_mm: 25.0
  phase_transition_width_c: 1.0
  evaporation_temperature_offset_c: 5.0
  feature_scales_mm:
  - 1000.0
  - 200.0
  - 100.0
  - 10.0
  - 10.0
  - 5.0
  parameters:
    rain_snow_threshold_c:
    - -2.0
    - 2.0
    - 0.0
    degree_day_mm_per_c_day:
    - 0.1
    - 8.0
    - 3.0
    soil_capacity_mm:
    - 20.0
    - 2000.0
    - 200.0
    recharge_fraction:
    - 0.001
    - 0.2
    - 0.03
    groundwater_recession:
    - 0.001
    - 0.5
    - 0.04
    evaporation_mm_per_c_day:
    - 0.01
    - 1.0
    - 0.15
