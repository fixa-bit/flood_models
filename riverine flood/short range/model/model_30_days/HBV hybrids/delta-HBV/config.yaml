data:
  daily_file: data/marala_daily.csv
  date_column: date
  basin_column: basin_id
  default_basin_id: marala
  target_column: q_cumecs
  dynamic_columns:
  - rain_era5_mm
  - temperature_c
  - pet_mm
  static_file: null
  static_columns: []
  use_static: false
  past_discharge: false
  hindcast_length: 365
  forecast_horizon: 30
  calendar_features: true
  forecast_mode: reanalysis_with_noise
  forecast_file: null
  forecast_date_column: date
  forecast_lead_column: lead_day
  forecast_available_at_column: null
  issue_hour_utc: 24
  forecast_columns:
  - precipitation_mm
  - temperature_c
  reanalysis_columns:
  - rain_era5_mm
  - temperature_c
  noise:
    std_at_lead_1: 0.05
    std_growth_per_lead: 0.025
    evaluation_seed: 12345
splits:
  train:
  - 2016
  - 2020
  validation:
  - 2021
  - 2021
  test:
  - 2022
  - 2024
normalization:
  inputs: standard
  static: standard
  flow_scale_cumecs: 1.0
  standardize_log_flow: true
model:
  hidden_size: 32
  dropout: 0.1
  components: 3
  dynamic_parameters:
  - parBETA
  - parCFMAX
  - parK1
  dynamic_logit_scale: 2.0
  warmup_without_gradients: 305
  area_km2: 28780.645645367713
  area_metadata: ../../../../dataset/chenab_marala/raw/marala/temperature/google_earth_engine/catchment_metadata.json
training:
  output_dir: runs/initial/seed_42
  epochs: 80
  batch_size: 64
  learning_rate: 0.002
  weight_decay: 0.0001
  patience: 10
  min_delta: 0.0001
  gradient_clip: 1.0
  seed: 42
  cpu_threads: 2
  device: cpu
  sample_stride: 3
  flow_mse_weight: 0.8
  log_mse_weight: 0.2
evaluation:
  output_dir: reports/initial
  comparison_dir: ../../../../evaluation comparison/model_30_days/delta_hbv
  reference_predictions: ../../../../model/model_30_days/Hindcast-forecast LSTM/climatology_residual_ensemble/reports/initial/predictions.csv
  flood_percentile: 0.95
  reference_prediction_column: Residual_ensemble
  reference_name: Climatology_residual_ensemble
